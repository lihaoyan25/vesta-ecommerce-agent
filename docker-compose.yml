name: vesta-shop

services:
  # MySQL：首次启动自动创建 .env 中的数据库与应用账号
  mysql:
    image: mysql:8.0
    container_name: vesta-mysql
    command: --character-set-server=utf8 --collation-server=utf8_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # 后端：FastAPI + uvicorn
  backend:
    build: .
    container_name: vesta-backend
    env_file: .env
    environment:
      # 容器网络内通过服务名访问数据库（覆盖 .env 中的 host）
      DATABASE_HOST: mysql
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    volumes:
      # 商品图片等静态资源持久化在宿主机
      - ./static:/app/static
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # 前端：Nginx 托管 dist 并反代 /api、/static
  frontend:
    build: ./frontend
    container_name: vesta-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
